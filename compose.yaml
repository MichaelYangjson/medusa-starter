services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: medusa-starter
      POSTGRES_PASSWORD: medusa-password
      POSTGRES_DB: medusa-starter
    ports:
      - 5432:5432
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 1024M
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "medusa-starter"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - 6379:6379
    networks:
      - dokploy-network
    volumes:
      - cache-backend-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-server:
    build: medusa-starter-default
    ports:
      - 9000
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2048M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-server-data:/data
    environment:
      NODE_ENV: production
      # 域名配置
      MEDUSA_BACKEND_URL: https://api.futuretools.app
      MEDUSA_ADMIN_BACKEND_URL: https://api.futuretools.app
      # CORS配置
      STORE_CORS: https://api.futuretools.app,https://admin.futuretools.app
      ADMIN_CORS: https://api.futuretools.app,https://admin.futuretools.app
      # Redis配置
      REDIS_URL: redis://redis:6379
      CACHE_REDIS_URL: redis://redis:6379
      EVENTS_REDIS_URL: redis://redis:6379
      WORKER_REDIS_URL: redis://redis:6379
      # 数据库配置
      DATABASE_URL: postgres://medusa-starter:medusa-password@postgres:5432/medusa-starter
      POSTGRES_URL: postgres://medusa-starter:medusa-password@postgres:5432/medusa-starter
      # Admin用户配置
      MEDUSA_CREATE_ADMIN_USER: true
      MEDUSA_ADMIN_EMAIL: albertyang123456@gmail.com
      MEDUSA_ADMIN_PASSWORD: as123456
      # JWT配置
      JWT_SECRET: PuBDURTvGFEkedRB2SgGQgHD842u8Mw7CwUcMCiGF7Y=
      COOKIE_SECRET: PuBDURTvGFEkedRB2SgGQgHD842u8Mw7CwUcMCiGF7Y=
    labels:
      - "traefik.enable=true"
      # API域名路由配置 - 处理所有API路径
      - "traefik.http.routers.medusa-api.rule=Host(`api.futuretools.app`)"
      - "traefik.http.routers.medusa-api.entrypoints=websecure"
      - "traefik.http.routers.medusa-api.tls.certResolver=letsencrypt"
      - "traefik.http.services.medusa-api.loadbalancer.server.port=9000"
      # Admin域名路由配置 - 重定向到/app路径
      - "traefik.http.routers.medusa-admin.rule=Host(`admin.futuretools.app`)"
      - "traefik.http.routers.medusa-admin.entrypoints=websecure"
      - "traefik.http.routers.medusa-admin.tls.certResolver=letsencrypt"
      - "traefik.http.routers.medusa-admin.middlewares=admin-redirect"
      - "traefik.http.services.medusa-admin.loadbalancer.server.port=9000"
      # 中间件：将admin域名重定向到/app路径
      - "traefik.http.middlewares.admin-redirect.redirectregex.regex=^https://admin.futuretools.app/?$$"
      - "traefik.http.middlewares.admin-redirect.redirectregex.replacement=https://admin.futuretools.app/app"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

networks:
  dokploy-network:
    external: true

volumes:
  postgres-data:
  backend-server-data:
  cache-backend-data:
