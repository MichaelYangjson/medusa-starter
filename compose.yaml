services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: medusa-starter
      POSTGRES_PASSWORD: medusa-password
      POSTGRES_DB: medusa-starter
      # 明确禁用SSL
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=trust"
    command: ["postgres", "-c", "ssl=off"]
    # 移除端口映射，只在容器内部使用
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 1024M
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "medusa-starter"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    # 移除端口映射，只在容器内部使用
    networks:
      - dokploy-network
    volumes:
      - cache-backend-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-server:
    build: medusa-starter-default
    ports:
      - 9000
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2048M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-server-data:/data
    environment:
      NODE_ENV: production
      # SSL禁用配置
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      # 域名配置
      MEDUSA_BACKEND_URL: https://api.futuretools.app
      MEDUSA_ADMIN_BACKEND_URL: https://api.futuretools.app
      # CORS配置
      STORE_CORS: https://api.futuretools.app,https://admin.futuretools.app
      ADMIN_CORS: https://api.futuretools.app,https://admin.futuretools.app
      AUTH_CORS: https://api.futuretools.app,https://admin.futuretools.app
      # Redis配置
      REDIS_URL: redis://redis:6379
      CACHE_REDIS_URL: redis://redis:6379
      EVENTS_REDIS_URL: redis://redis:6379
      WE_REDIS_URL: redis://redis:6379
      # 数据库配置
      DATABASE_URL: postgres://medusa-starter:medusa-password@postgres:5432/medusa-starter?sslmode=disable
      POSTGRES_URL: postgres://medusa-starter:medusa-password@postgres:5432/medusa-starter?sslmode=disable
      # PostgreSQL SSL禁用配置
      PGSSLMODE: disable
      PGSSL: false
      # Admin用户配置
      MEDUSA_CREATE_ADMIN_USER: true
      MEDUSA_ADMIN_EMAIL: albertyang123456@gmail.com
      MEDUSA_ADMIN_PASSWORD: as123456
      # JWT配置
      JWT_SECRET: PuBDURTvGFEkedRB2SgGQgHD842u8Mw7CwUcMCiGF7Y=
      COOKIE_SECRET: PuBDURTvGFEkedRB2SgGQgHD842u8Mw7CwUcMCiGF7Y=

    labels:
      - "traefik.enable=true"
      # API域名路由配置
      - "traefik.http.routers.medusa-api.rule=Host(`api.futuretools.app`)"
      - "traefik.http.routers.medusa-api.entrypoints=websecure"
      - "traefik.http.routers.medusa-api.tls.certResolver=letsencrypt"
      - "traefik.http.routers.medusa-api.service=medusa-api"
      - "traefik.http.services.medusa-api.loadbalancer.server.port=9000"
      # Admin域名路由配置
      - "traefik.http.routers.medusa-admin.rule=Host(`admin.futuretools.app`)"
      - "traefik.http.routers.medusa-admin.entrypoints=websecure"
      - "traefik.http.routers.medusa-admin.tls.certResolver=letsencrypt"
      - "traefik.http.routers.medusa-admin.service=medusa-admin"
      - "traefik.http.services.medusa-admin.loadbalancer.server.port=9000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9000/health",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

networks:
  dokploy-network:
    external: true

volumes:
  postgres-data:
  backend-server-data:
  cache-backend-data:
