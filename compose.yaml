services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: medusa-starter
      POSTGRES_PASSWORD: medusa-password
      POSTGRES_DB: medusa-starter
      # 明确禁用SSL
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=trust"
    command: ["postgres", "-c", "ssl=off"]
    # 移除端口映射，只在容器内部使用
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 1024M
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "medusa-starter"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    # 移除端口映射，只在容器内部使用
    networks:
      - dokploy-network
    volumes:
      - cache-backend-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-server:
    build: medusa-starter-default
    expose:
      - "9000"
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2048M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-server-data:/data
    environment:
      NODE_ENV: production
      # SSL禁用配置
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      # 域名配置
      MEDUSA_BACKEND_URL: https://api.futuretools.app
      MEDUSA_ADMIN_BACKEND_URL: https://api.futuretools.app
      # CORS配置
      STORE_CORS: https://api.futuretools.app
      ADMIN_CORS: https://api.futuretools.app
      AUTH_CORS: https://api.futuretools.app
      # Redis配置
      REDIS_URL: redis://redis:6379
      CACHE_REDIS_URL: redis://redis:6379
      EVENTS_REDIS_URL: redis://redis:6379
      WE_REDIS_URL: redis://redis:6379
      # 数据库配置
      DATABASE_URL: postgres://medusa-starter:medusa-password@postgres:5432/medusa-starter?sslmode=disable
      POSTGRES_URL: postgres://medusa-starter:medusa-password@postgres:5432/medusa-starter?sslmode=disable
      # PostgreSQL SSL禁用配置
      PGSSLMODE: disable
      PGSSL: false
      # Admin用户配置
      MEDUSA_CREATE_ADMIN_USER: true
      MEDUSA_ADMIN_EMAIL: albertyang123456@gmail.com
      MEDUSA_ADMIN_PASSWORD: as123456
      # JWT配置
      JWT_SECRET: PuBDURTvGFEkedRB2SgGQgHD842u8Mw7CwUcMCiGF7Y=
      COOKIE_SECRET: PuBDURTvGFEkedRB2SgGQgHD842u8Mw7CwUcMCiGF7Y=
      # S3存储配置
      S3_FILE_URL: ${S3_FILE_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PREFIX: ${S3_PREFIX:-medusa}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    labels:
      - "traefik.enable=true"
      # Debug信息
      - "traefik.docker.network=dokploy-network"
      # 服务定义
      - "traefik.http.services.medusa-backend.loadbalancer.server.port=9000"
      # 单域名配置
      - "traefik.http.routers.medusa.rule=Host(`api.futuretools.app`)"
      - "traefik.http.routers.medusa.entrypoints=web,websecure"
      - "traefik.http.routers.medusa.tls.certResolver=letsencrypt"
      - "traefik.http.routers.medusa.service=medusa-backend"

networks:
  dokploy-network:
    external: true

volumes:
  postgres-data:
  backend-server-data:
  cache-backend-data:
